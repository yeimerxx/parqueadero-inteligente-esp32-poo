# ==============================================================================
# CONFIGURACIÓN ECLIPSE MOSQUITTO - PARQUEADERO INTELIGENTE ESP32
# Corporación Universitaria Americana
# ==============================================================================
# Este archivo habilita la comunicación doble:
# 1. Puerto 1883 TCP (MQTT estándar para microcontrolador ESP32 y simulador Python)
# 2. Puerto 9001 WebSockets (para el Gemelo Digital Web en el navegador)
# ==============================================================================

# Persistencia de mensajes retenidos
persistence true
persistence_location C:/Program Files/mosquitto/data/

# Registro de eventos
log_dest file C:/Program Files/mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# ------------------------------------------------------------------------------
# LISTENER 1: MQTT Nativo TCP (ESP32, PlatformIO, Simulador Python)
# ------------------------------------------------------------------------------
listener 1883 0.0.0.0
protocol mqtt

# ------------------------------------------------------------------------------
# LISTENER 2: MQTT sobre WebSockets (Dashboard Web / Gemelo Digital 2.5D)
# ------------------------------------------------------------------------------
listener 9001 0.0.0.0
protocol websockets

# ------------------------------------------------------------------------------
# AUTENTICACIÓN Y SEGURIDAD
# ------------------------------------------------------------------------------
# Modo desarrollo con usuario y contraseña:
allow_anonymous false
password_file C:/Program Files/mosquitto/passwd

# Para permitir conexiones sin usuario/clave en pruebas rápidas locales, cambiar a:
# allow_anonymous true
# y comentar la directiva password_file.
